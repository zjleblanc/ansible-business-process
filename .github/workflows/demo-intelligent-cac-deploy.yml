name: demo-intelligent-cac-deploy

on:
  workflow_dispatch:
    inputs:
      deploy_config:
        description: 'Force deploy of AAP config-as-code, even if aap_config/** did not change'
        type: boolean
        default: false
      sync_project:
        description: 'Force a Controller project sync, even if automation content did not change'
        type: boolean
        default: false
      base_ref:
        description: 'Git ref/SHA to diff against for change detection'
        type: string
        default: 'HEAD~1'

concurrency:
  group: demo-intelligent-cac-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AAP_PROJECT_NAME: "Business Process"

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      config_changed: ${{ steps.resolve.outputs.config_changed }}
      content_changed: ${{ steps.resolve.outputs.content_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ inputs.base_ref }}
          filters: |
            config:
              - 'aap_config/**'
            content:
              - 'playbooks/**'
              - 'tasks/**'
              - 'collections/**'
              - 'roles/**'
              - 'filter_plugins/**'
              - 'rulebooks/**'

      - name: Resolve effective change flags
        id: resolve
        run: |
          config_changed="${{ steps.filter.outputs.config }}"
          content_changed="${{ steps.filter.outputs.content }}"

          if [ "${{ inputs.deploy_config }}" = "true" ]; then
            config_changed="true"
          fi
          if [ "${{ inputs.sync_project }}" = "true" ]; then
            content_changed="true"
          fi

          echo "config_changed=${config_changed}" >> "$GITHUB_OUTPUT"
          echo "content_changed=${content_changed}" >> "$GITHUB_OUTPUT"

          {
            echo "### Change detection"
            echo "- config_changed: \`${config_changed}\`"
            echo "- content_changed: \`${content_changed}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-config:
    name: Deploy AAP configuration
    needs: detect-changes
    if: needs.detect-changes.outputs.config_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install collections
        run: |
          ansible-galaxy collection install infra.aap_configuration
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Deploy AAP configuration
        run: ansible-playbook playbooks/pb_deploy_aap_config.yml
        env:
          ANSIBLE_NOCOLOR: "1"
          CONTROLLER_HOST: ${{ secrets.AAP_HOST }}
          CONTROLLER_OAUTH_TOKEN: ${{ secrets.AAP_OAUTH_TOKEN }}
          CONTROLLER_VERIFY_SSL: ${{ vars.AAP_VALIDATE_CERTS || 'true' }}

  sync-project:
    name: Sync AAP project
    needs: [detect-changes, deploy-config]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.deploy-config.result == 'success' || needs.deploy-config.result == 'skipped') &&
      (needs.detect-changes.outputs.config_changed == 'true' || needs.detect-changes.outputs.content_changed == 'true')
    runs-on: ubuntu-latest
    env:
      AAP_HOST: ${{ secrets.AAP_HOST }}
      AAP_OAUTH_TOKEN: ${{ secrets.AAP_OAUTH_TOKEN }}
      AAP_INSECURE: ${{ vars.AAP_VALIDATE_CERTS == 'false' && '-k' || '' }}
    steps:
      - name: Resolve project ID
        id: project
        run: |
          set -euo pipefail
          encoded_name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${AAP_PROJECT_NAME}")
          response=$(curl -sS ${AAP_INSECURE} --fail-with-body \
            -H "Authorization: Bearer ${AAP_OAUTH_TOKEN}" \
            "${AAP_HOST}/api/v2/projects/?name=${encoded_name}")
          project_id=$(echo "${response}" | python3 -c "import json,sys; print(json.load(sys.stdin)['results'][0]['id'])")
          echo "id=${project_id}" >> "$GITHUB_OUTPUT"

      - name: Trigger project sync
        id: sync
        run: |
          set -euo pipefail
          response=$(curl -sS ${AAP_INSECURE} --fail-with-body -X POST \
            -H "Authorization: Bearer ${AAP_OAUTH_TOKEN}" \
            "${AAP_HOST}/api/v2/projects/${PROJECT_ID}/update/")
          update_id=$(echo "${response}" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "update_id=${update_id}" >> "$GITHUB_OUTPUT"
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}

      - name: Wait for project sync to complete
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status=$(curl -sS ${AAP_INSECURE} --fail-with-body \
              -H "Authorization: Bearer ${AAP_OAUTH_TOKEN}" \
              "${AAP_HOST}/api/v2/project_updates/${UPDATE_ID}/" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            echo "Project update status: ${status}"
            case "${status}" in
              successful)
                exit 0
                ;;
              failed|error|canceled)
                echo "Project sync failed with status: ${status}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for project sync to complete" >&2
          exit 1
        env:
          UPDATE_ID: ${{ steps.sync.outputs.update_id }}
