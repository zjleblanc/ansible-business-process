---
controller_credential_types:
  - name: Google OAuth Client
    description: >-
      OAuth2 installed-app client credentials for the business.google collection
      (gmail_search, gsheet_read, gsheet_update). Injects client_id/
      client_secret/refresh_token as extra vars and env vars so playbooks can
      use either the module arguments or the env var fallback documented in
      collections/ansible_collections/business/google/README.md.
    kind: cloud
    inputs:
      fields:
        - id: google_client_id
          type: string
          label: Google OAuth Client ID
        - id: google_client_secret
          type: string
          label: Google OAuth Client Secret
          secret: true
        - id: google_refresh_token
          type: string
          label: Google OAuth Refresh Token
          secret: true
      required:
        - google_client_id
        - google_client_secret
        - google_refresh_token
    injectors:
      extra_vars:
        google_client_id: "{{ google_client_id }}"
        google_client_secret: "{{ google_client_secret }}"
        google_refresh_token: "{{ google_refresh_token }}"
      env:
        GOOGLE_CLIENT_ID: "{{ google_client_id }}"
        GOOGLE_CLIENT_SECRET: "{{ google_client_secret }}"
        GOOGLE_REFRESH_TOKEN: "{{ google_refresh_token }}"

  - name: OpenAI Config
    description: >-
      OpenAI / AI RCA API configuration for playbook extra vars and env lookups
    kind: cloud
    inputs:
      fields:
        - id: ai_rca_api_key
          type: string
          label: API Key
          secret: true
        - id: ai_rca_api_base
          type: string
          label: API Base URL
          default: https://api.openai.com/v1
          help_text: e.g. https://api.openai.com/v1
        - id: ai_rca_model
          type: string
          label: Model
          default: gpt-4o-mini
      required:
        - ai_rca_api_key
    injectors:
      env:
        AI_RCA_MODEL: "{{ ai_rca_model }}"
        AI_RCA_API_KEY: "{{ ai_rca_api_key }}"
        OPENAI_API_KEY: "{{ ai_rca_api_key }}"
        OPENAI_API_BASE: "{{ ai_rca_api_base }}"
      extra_vars:
        ai_rca_model: "{{ ai_rca_model }}"
        ai_rca_api_key: "{{ ai_rca_api_key }}"
        ai_rca_api_base: "{{ ai_rca_api_base }}"

  - name: Ansible Support Analyzer
    description: >-
      Red Hat offline token, LLM endpoint settings, and Google Sheets credentials shared by
      playbooks/pb_analyze_support_cases.yml and playbooks/pb_track_support_cases.yml (the
      business.support collection). Writes the service account key to a temp file and sets
      GOOGLE_SA_CRED_PATH for gsheet_update and gsheet_tracker. Attach a separate Credential of
      this type to each job template (analyzer vs. tracker) so gsheet_sheet can differ per
      playbook; the tracker job template also needs an "SMTP Server" credential.
    kind: cloud
    inputs:
      fields:
        - id: redhat_offline_token
          type: string
          label: Red Hat offline token
          secret: true
          help_text: >-
            Offline token from https://access.redhat.com/management/api
        - id: llm_api_key
          type: string
          label: LLM API key
          secret: true
          help_text: >-
            Use EMPTY for local OpenAI-compatible servers without auth
        - id: llm_api_base_url
          type: string
          label: LLM API base URL
          help_text: >-
            e.g. https://api.openai.com/v1 or http://localhost:8000/v1
        - id: llm_model
          type: string
          label: LLM model name
          help_text: Model identifier for llm_summarize (maps to LLM_MODEL).
        - id: google_service_account_json
          type: string
          label: Google service account JSON
          secret: true
          multiline: true
          help_text: >-
            Full contents of the service account key file. Materialized at job
            runtime; path exposed as GOOGLE_SA_CRED_PATH for gsheet_update/gsheet_tracker.
        - id: google_sheet_id
          type: string
          label: Google spreadsheet ID
          help_text: Spreadsheet ID from the Google Sheets URL
        - id: gsheet_sheet
          type: string
          label: Default worksheet name
          default: Support Case Tracker
          help_text: >-
            Default worksheet tab name. Set to "Accounts" on the Credential attached
            to the pb_analyze_support_cases.yml job template; leave as the default
            ("Support Case Tracker") on the Credential attached to the
            pb_track_support_cases.yml job template.
        - id: gsheet_lookup_column
          type: string
          label: Default lookup column
          help_text: Column letter to find the account row (used by pb_analyze_support_cases.yml only).
        - id: gsheet_update_column
          type: string
          label: Default update column
          help_text: Column letter for the JSON report payload (used by pb_analyze_support_cases.yml only).
      required:
        - redhat_offline_token
        - llm_api_key
        - llm_api_base_url
        - llm_model
        - google_service_account_json
        - google_sheet_id
    injectors:
      env:
        REDHAT_OFFLINE_TOKEN: !unsafe "{{ redhat_offline_token }}"
        LLM_API_KEY: !unsafe "{{ llm_api_key }}"
        LLM_API_BASE_URL: !unsafe "{{ llm_api_base_url }}"
        LLM_MODEL: !unsafe "{{ llm_model }}"
        GOOGLE_SA_CRED_PATH: !unsafe "{{ tower.filename }}"
        GOOGLE_SHEET_ID: !unsafe "{{ google_sheet_id }}"
        GSHEET_SHEET: !unsafe "{{ gsheet_sheet }}"
        GSHEET_LOOKUP_COLUMN: !unsafe "{{ gsheet_lookup_column }}"
        GSHEET_UPDATE_COLUMN: !unsafe "{{ gsheet_update_column }}"
      file:
        template: !unsafe "{{ google_service_account_json }}"

  - name: SMTP Server
    description: >-
      For use with community.general.mail to send e-mail notifications. Used by
      playbooks/pb_track_support_cases.yml for change-notification emails. Mirrored from
      https://github.com/zjleblanc/ansible-cac/blob/main/config/common/credential_types.yml
    kind: cloud
    inputs:
      fields:
        - id: email_smtp_server
          label: Server
          type: string
          help_text: Example - smtp.gmail.com
        - id: email_smtp_server_port
          label: Port
          type: string
          help_text: Example - 587
        - id: email_smtp_username
          label: Username
          type: string
          help_text: Username to authenticate with SMTP server
        - id: email_smtp_password
          label: Password
          type: string
          secret: true
          help_text: Password to authenticate with SMTP server
        - id: email_smtp_from_address
          label: From Address
          type: string
          help_text: Example - sender@gmail.com
      required:
        - email_smtp_server
        - email_smtp_server_port
        - email_smtp_username
        - email_smtp_password
        - email_smtp_from_address
    injectors:
      extra_vars:
        MAILHOST: !unsafe "{{ email_smtp_server }}"
        MAILHOST_PASSWORD: !unsafe "{{ email_smtp_password }}"
        MAILHOST_PORT: !unsafe "{{ email_smtp_server_port }}"
        MAILHOST_USERNAME: !unsafe "{{ email_smtp_username }}"
        email_smtp_from_address: !unsafe "{{ email_smtp_from_address }}"
        email_smtp_password: !unsafe "{{ email_smtp_password }}"
        email_smtp_server: !unsafe "{{ email_smtp_server }}"
        email_smtp_server_port: !unsafe "{{ email_smtp_server_port }}"
        email_smtp_username: !unsafe "{{ email_smtp_username }}"
        smtp_password: !unsafe "{{ email_smtp_password }}"
        smtp_port: !unsafe "{{ email_smtp_server_port }}"
        smtp_username: !unsafe "{{ email_smtp_username }}"
        smtpserver: !unsafe "{{ email_smtp_server }}"
