---
controller_credentials:
  - name: Google OAuth Client
    description: zleblanc-ansible-business OAuth2 client
    organization: Autodotes
    credential_type: Google OAuth Client
    inputs:
      google_client_id: "{{ vault_google_client_id }}"
      google_client_secret: "{{ vault_google_client_secret }}"
      google_refresh_token: "{{ vault_google_refresh_token }}"

  - name: OpenAI Config
    description: | 
      Ansible Task Summarizer key: 
      https://maas-rhdp-frontend.apps.maas.redhatworkshops.io/api-keys
    organization: Autodotes
    credential_type: OpenAI Config
    inputs:
      ai_rca_api_key: "{{ vault_ai_rca_api_key }}"
      ai_rca_api_base: >-
        {{ vault_ai_rca_api_base }}
      ai_rca_model: "{{ vault_ai_rca_model }}"
