---
controller_credentials:
  - name: Google OAuth Client
    description: zleblanc-ansible-business OAuth2 client
    organization: Autodotes
    credential_type: Google OAuth Client
    inputs:
      google_client_id: "{{ vault_google_client_id }}"
      google_client_secret: "{{ vault_google_client_secret }}"
      google_refresh_token: "{{ vault_google_refresh_token }}"

  - name: OpenAI Config
    description: | 
      Ansible Task Summarizer key: 
      https://maas-rhdp-frontend.apps.maas.redhatworkshops.io/api-keys
    organization: Autodotes
    credential_type: OpenAI Config
    inputs:
      ai_rca_api_key: "{{ vault_ai_rca_api_key }}"
      ai_rca_api_base: >-
        {{ vault_ai_rca_api_base }}
      ai_rca_model: "{{ vault_ai_rca_model }}"

  - name: Support Analyzer - Accounts
    description: >-
      Ansible Support Analyzer credential for playbooks/pb_analyze_support_cases.yml;
      writes to the "Accounts" worksheet tab.
    organization: Autodotes
    credential_type: Ansible Support Analyzer
    inputs:
      redhat_offline_token: "{{ vault_redhat_offline_token }}"
      llm_api_key: "{{ vault_llm_api_key }}"
      llm_api_base_url: "{{ vault_llm_api_base_url }}"
      llm_model: "{{ vault_llm_model }}"
      google_service_account_json: "{{ vault_google_service_account_json }}"
      google_sheet_id: "{{ vault_google_sheet_id }}"
      gsheet_sheet: Accounts
      gsheet_lookup_column: K
      gsheet_update_column: O

  - name: Support Analyzer - Tracker
    description: >-
      Ansible Support Analyzer credential for playbooks/pb_track_support_cases.yml;
      writes to the self-managed "Support Case Tracker" worksheet tab.
    organization: Autodotes
    credential_type: Ansible Support Analyzer
    inputs:
      redhat_offline_token: "{{ vault_redhat_offline_token }}"
      llm_api_key: "{{ vault_llm_api_key }}"
      llm_api_base_url: "{{ vault_llm_api_base_url }}"
      llm_model: "{{ vault_llm_model }}"
      google_service_account_json: "{{ vault_google_service_account_json }}"
      google_sheet_id: "{{ vault_google_sheet_id }}"

  - name: SMTP Notifier
    description: >-
      SMTP credential for playbooks/pb_track_support_cases.yml change-notification emails.
    organization: Autodotes
    credential_type: SMTP Server
    inputs:
      email_smtp_server: "{{ vault_email_smtp_server }}"
      email_smtp_server_port: "{{ vault_email_smtp_server_port }}"
      email_smtp_username: "{{ vault_email_smtp_username }}"
      email_smtp_password: "{{ vault_email_smtp_password }}"
      email_smtp_from_address: "{{ vault_email_smtp_from_address }}"
